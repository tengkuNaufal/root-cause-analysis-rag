- id: F22
  class: bgp_inbound_filter
  layer: BGP
  link: r2-r4
  ground_truth:
    router: r2
    root_cause: route-map inbound dari 10.0.24.2 di r2 menolak 10.255.0.3/32
  expected_symptom: rute 10.255.0.3/32 dari 10.0.24.2 ditolak; r2 memakai jalur lain lewat AS ketiga
  inject:
    router: r2
    steps:
    - type: vtysh
      lines:
      - conf t
      - ip prefix-list PL-FAULT seq 5 permit 10.255.0.3/32
      - route-map RM-IN-FAULT deny 5
      - match ip address prefix-list PL-FAULT
      - exit
      - route-map RM-IN-FAULT permit 10
      - match ip address prefix-list PL-LOOPBACKS
      - exit
      - router bgp 65001
      - address-family ipv4 unicast
      - neighbor 10.0.24.2 route-map RM-IN-FAULT in
  revert:
    router: r2
    steps:
    - type: vtysh
      lines:
      - conf t
      - router bgp 65001
      - address-family ipv4 unicast
      - neighbor 10.0.24.2 route-map RM-EBGP-IN in
      - exit-address-family
      - exit
      - no route-map RM-IN-FAULT
      - no ip prefix-list PL-FAULT
