- id: F19
  class: bgp_wrong_remote_as
  layer: BGP
  link: r2-r4
  ground_truth:
    router: r2
    root_cause: remote-as 10.0.24.2 di r2 salah (65102, seharusnya 65002)
  expected_symptom: sesi eBGP tidak Established
  inject:
    router: r2
    steps:
    - type: vtysh
      lines:
      - conf t
      - router bgp 65001
      - neighbor 10.0.24.2 remote-as 65102
  revert:
    router: r2
    steps:
    - type: vtysh
      lines:
      - conf t
      - router bgp 65001
      - neighbor 10.0.24.2 remote-as 65002
      - address-family ipv4 unicast
      - neighbor 10.0.24.2 route-map RM-EBGP-IN in
      - neighbor 10.0.24.2 route-map RM-EBGP-OUT out
