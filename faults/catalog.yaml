version: 1
lab: replika (lab/replica/six-node)
status: belum disesuaikan dengan topologi Host 1
faults:
- id: F01
  class: mtu_mismatch
  layer: L2/L3
  link: r1-r2
  ground_truth:
    router: r1
    root_cause: MTU r1 eth1 1400, sisi lain 1500
  expected_symptom: OSPF macet di ExStart/Init, loopback tidak terjangkau
  inject:
    router: r1
    steps:
    - type: shell
      cmd: ip link set eth1 mtu 1400
  revert:
    router: r1
    steps:
    - type: shell
      cmd: ip link set eth1 mtu 1500
