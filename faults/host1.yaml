- id: F22
  class: bgp_inbound_filter
  layer: BGP
  link: L35
  ground_truth:
    router: r3
    root_cause: route-map PEER1_IN di r3 menolak 10.100.5.1/32 dari 10.0.35.2
  expected_symptom: r3 tidak menerima 10.100.5.1 dari r5, AS 65001 memakai jalur lewat r4-r6
  inject:
    router: r3
    steps:
    - type: vtysh
      lines:
      - conf t
      - ip prefix-list FAULT_IN seq 5 permit 10.100.5.1/32
      - route-map PEER1_IN deny 5
      - match ip address prefix-list FAULT_IN
  revert:
    router: r3
    steps:
    - type: vtysh
      lines:
      - conf t
      - no route-map PEER1_IN deny 5
      - no ip prefix-list FAULT_IN
