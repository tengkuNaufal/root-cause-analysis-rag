! Baseline RCA lab; edit source here, not clab-rca runtime copies.
frr version 10.7.1
frr defaults traditional
hostname r3
log stdout informational
log file /var/log/frr/events.log informational
log record-priority
log timestamp precision 6
service integrated-vtysh-config
!
interface lo
 ip address 10.255.0.3/32
 ip address 10.100.3.1/32
 ip ospf area 0.0.0.0
exit
!
interface eth1
 description L13_to_r1_eth2
 ip address 10.0.13.2/30
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 20
 ip ospf hello-interval 1
 ip ospf dead-interval 4
exit
!
interface eth2
 description L34_to_r4_eth2
 ip address 10.0.34.1/30
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
 ip ospf hello-interval 1
 ip ospf dead-interval 4
exit
!
interface eth3
 description L23_to_r2_eth3
 ip address 10.0.23.2/30
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 30
 ip ospf hello-interval 1
 ip ospf dead-interval 4
exit
!
interface eth4
 description L35_to_r5_eth1
 ip address 10.0.35.1/30
exit
!
router ospf
 log-adjacency-changes detail
 ospf router-id 10.255.0.3
 passive-interface default
 no passive-interface eth1
 no passive-interface eth2
 no passive-interface eth3
exit
!
ip prefix-list PEER1_IN_1 seq 10 permit 10.100.5.1/32
route-map PEER1_IN permit 10
 match ip address prefix-list PEER1_IN_1
 set local-preference 200
exit
!
ip prefix-list PEER1_IN_2 seq 10 permit 10.100.6.1/32
route-map PEER1_IN permit 20
 match ip address prefix-list PEER1_IN_2
 set local-preference 100
exit
!
route-map PEER1_IN deny 1000
exit
!
ip prefix-list PEER1_OUT seq 10 permit 10.100.1.1/32
ip prefix-list PEER1_OUT seq 20 permit 10.100.2.1/32
ip prefix-list PEER1_OUT seq 30 permit 10.100.3.1/32
ip prefix-list PEER1_OUT seq 40 permit 10.100.4.1/32
route-map PEER1_OUT permit 10
 match ip address prefix-list PEER1_OUT
exit
route-map PEER1_OUT deny 1000
exit
!
router bgp 65001
 bgp router-id 10.255.0.3
 bgp log-neighbor-changes
 bgp ebgp-requires-policy
 bgp network import-check
 no bgp default ipv4-unicast
 timers bgp 3 9
 neighbor 10.255.0.1 remote-as 65001
 neighbor 10.255.0.1 description IBGP_r1
 neighbor 10.255.0.1 update-source 10.255.0.3
 neighbor 10.255.0.2 remote-as 65001
 neighbor 10.255.0.2 description IBGP_r2
 neighbor 10.255.0.2 update-source 10.255.0.3
 neighbor 10.255.0.4 remote-as 65001
 neighbor 10.255.0.4 description IBGP_r4
 neighbor 10.255.0.4 update-source 10.255.0.3
 neighbor 10.0.35.2 remote-as 65002
 neighbor 10.0.35.2 description EBGP_PEER1
 !
 address-family ipv4 unicast
  network 10.100.3.1/32
  neighbor 10.255.0.1 activate
  neighbor 10.255.0.1 next-hop-self
  neighbor 10.255.0.2 activate
  neighbor 10.255.0.2 next-hop-self
  neighbor 10.255.0.4 activate
  neighbor 10.255.0.4 next-hop-self
  neighbor 10.0.35.2 activate
  neighbor 10.0.35.2 route-map PEER1_IN in
  neighbor 10.0.35.2 route-map PEER1_OUT out
 exit-address-family
exit
!
end

