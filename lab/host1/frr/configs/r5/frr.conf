! Baseline RCA lab; edit source here, not clab-rca runtime copies.
frr version 10.7.1
frr defaults traditional
hostname r5
log stdout informational
log file /var/log/frr/events.log informational
log record-priority
log timestamp precision 6
service integrated-vtysh-config
!
interface lo
 ip address 10.255.0.5/32
 ip address 10.100.5.1/32
exit
!
interface eth1
 description L35_to_r3_eth4
 ip address 10.0.35.2/30
exit
!
interface eth2
 description L56_to_r6_eth2
 ip address 10.0.56.1/30
exit
!
ip prefix-list PEER1_IN_1 seq 10 permit 10.100.1.1/32
ip prefix-list PEER1_IN_1 seq 20 permit 10.100.2.1/32
ip prefix-list PEER1_IN_1 seq 30 permit 10.100.3.1/32
ip prefix-list PEER1_IN_1 seq 40 permit 10.100.4.1/32
route-map PEER1_IN permit 10
 match ip address prefix-list PEER1_IN_1
exit
!
route-map PEER1_IN deny 1000
exit
!
ip prefix-list PEER1_OUT seq 10 permit 10.100.5.1/32
ip prefix-list PEER1_OUT seq 20 permit 10.100.6.1/32
route-map PEER1_OUT permit 10
 match ip address prefix-list PEER1_OUT
exit
route-map PEER1_OUT deny 1000
exit
!
ip prefix-list PEER2_IN_1 seq 10 permit 10.100.6.1/32
ip prefix-list PEER2_IN_1 seq 20 permit 10.100.1.1/32
ip prefix-list PEER2_IN_1 seq 30 permit 10.100.2.1/32
ip prefix-list PEER2_IN_1 seq 40 permit 10.100.3.1/32
ip prefix-list PEER2_IN_1 seq 50 permit 10.100.4.1/32
route-map PEER2_IN permit 10
 match ip address prefix-list PEER2_IN_1
exit
!
route-map PEER2_IN deny 1000
exit
!
ip prefix-list PEER2_OUT seq 10 permit 10.100.5.1/32
ip prefix-list PEER2_OUT seq 20 permit 10.100.1.1/32
ip prefix-list PEER2_OUT seq 30 permit 10.100.2.1/32
ip prefix-list PEER2_OUT seq 40 permit 10.100.3.1/32
ip prefix-list PEER2_OUT seq 50 permit 10.100.4.1/32
route-map PEER2_OUT permit 10
 match ip address prefix-list PEER2_OUT
exit
route-map PEER2_OUT deny 1000
exit
!
router bgp 65002
 bgp router-id 10.255.0.5
 bgp log-neighbor-changes
 bgp ebgp-requires-policy
 bgp network import-check
 no bgp default ipv4-unicast
 timers bgp 3 9
 neighbor 10.0.35.1 remote-as 65001
 neighbor 10.0.35.1 description EBGP_PEER1
 neighbor 10.0.56.2 remote-as 65003
 neighbor 10.0.56.2 description EBGP_PEER2
 !
 address-family ipv4 unicast
  network 10.100.5.1/32
  neighbor 10.0.35.1 activate
  neighbor 10.0.35.1 route-map PEER1_IN in
  neighbor 10.0.35.1 route-map PEER1_OUT out
  neighbor 10.0.56.2 activate
  neighbor 10.0.56.2 route-map PEER2_IN in
  neighbor 10.0.56.2 route-map PEER2_OUT out
 exit-address-family
exit
!
end

