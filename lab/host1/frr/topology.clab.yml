# Before first deploy: bash host1/log_ingestion/manage.sh prepare
# Baseline source; runtime files are generated under clab-rca/.
# Validate before deploy. Keep the NetworkLab WSL terminal open.
name: rca

mgmt:
  network: rca-mgmt
  ipv4-subnet: 172.30.80.0/24
  ipv4-gw: 172.30.80.1

topology:
  defaults:
    kind: frr
    image: quay.io/frrouting/frr:containerlab-10.7.1@sha256:f7d98e4faa24333c1fdb638f72678111de07a7aef90566132655dbadceca86c7
    enforce-startup-config: true
    restart-policy: "no"
    sysctls:
      net.ipv4.ip_forward: "1"
      net.ipv4.conf.all.rp_filter: "0"
      net.ipv4.conf.default.rp_filter: "0"

  nodes:
    r1:
      binds:
        - ../../../data/host1/logs/raw/r1:/var/log/frr
      mgmt-ipv4: 172.30.80.11
      startup-config: configs/r1/frr.conf
      daemons: [bgpd, ospfd]
      exec:
        - ip link set dev eth1 mtu 1500 up
        - sysctl -w net.ipv4.conf.eth1.rp_filter=0
        - ip link set dev eth2 mtu 1500 up
        - sysctl -w net.ipv4.conf.eth2.rp_filter=0
    r2:
      binds:
        - ../../../data/host1/logs/raw/r2:/var/log/frr
      mgmt-ipv4: 172.30.80.12
      startup-config: configs/r2/frr.conf
      daemons: [bgpd, ospfd]
      exec:
        - ip link set dev eth1 mtu 1500 up
        - sysctl -w net.ipv4.conf.eth1.rp_filter=0
        - ip link set dev eth2 mtu 1500 up
        - sysctl -w net.ipv4.conf.eth2.rp_filter=0
        - ip link set dev eth3 mtu 1500 up
        - sysctl -w net.ipv4.conf.eth3.rp_filter=0
    r3:
      binds:
        - ../../../data/host1/logs/raw/r3:/var/log/frr
      mgmt-ipv4: 172.30.80.13
      startup-config: configs/r3/frr.conf
      daemons: [bgpd, ospfd]
      exec:
        - ip link set dev eth1 mtu 1500 up
        - sysctl -w net.ipv4.conf.eth1.rp_filter=0
        - ip link set dev eth2 mtu 1500 up
        - sysctl -w net.ipv4.conf.eth2.rp_filter=0
        - ip link set dev eth3 mtu 1500 up
        - sysctl -w net.ipv4.conf.eth3.rp_filter=0
        - ip link set dev eth4 mtu 1500 up
        - sysctl -w net.ipv4.conf.eth4.rp_filter=0
    r4:
      binds:
        - ../../../data/host1/logs/raw/r4:/var/log/frr
      mgmt-ipv4: 172.30.80.14
      startup-config: configs/r4/frr.conf
      daemons: [bgpd, ospfd]
      exec:
        - ip link set dev eth1 mtu 1500 up
        - sysctl -w net.ipv4.conf.eth1.rp_filter=0
        - ip link set dev eth2 mtu 1500 up
        - sysctl -w net.ipv4.conf.eth2.rp_filter=0
        - ip link set dev eth3 mtu 1500 up
        - sysctl -w net.ipv4.conf.eth3.rp_filter=0
    r5:
      binds:
        - ../../../data/host1/logs/raw/r5:/var/log/frr
      mgmt-ipv4: 172.30.80.15
      startup-config: configs/r5/frr.conf
      daemons: [bgpd]
      exec:
        - ip link set dev eth1 mtu 1500 up
        - sysctl -w net.ipv4.conf.eth1.rp_filter=0
        - ip link set dev eth2 mtu 1500 up
        - sysctl -w net.ipv4.conf.eth2.rp_filter=0
    r6:
      binds:
        - ../../../data/host1/logs/raw/r6:/var/log/frr
      mgmt-ipv4: 172.30.80.16
      startup-config: configs/r6/frr.conf
      daemons: [bgpd]
      exec:
        - ip link set dev eth1 mtu 1500 up
        - sysctl -w net.ipv4.conf.eth1.rp_filter=0
        - ip link set dev eth2 mtu 1500 up
        - sysctl -w net.ipv4.conf.eth2.rp_filter=0

  links:
    # L12
    - endpoints: ["r1:eth1", "r2:eth1"]
      mtu: 1500
    # L13
    - endpoints: ["r1:eth2", "r3:eth1"]
      mtu: 1500
    # L24
    - endpoints: ["r2:eth2", "r4:eth1"]
      mtu: 1500
    # L34
    - endpoints: ["r3:eth2", "r4:eth2"]
      mtu: 1500
    # L23
    - endpoints: ["r2:eth3", "r3:eth3"]
      mtu: 1500
    # L35
    - endpoints: ["r3:eth4", "r5:eth1"]
      mtu: 1500
    # L46
    - endpoints: ["r4:eth3", "r6:eth1"]
      mtu: 1500
    # L56
    - endpoints: ["r5:eth2", "r6:eth2"]
      mtu: 1500
