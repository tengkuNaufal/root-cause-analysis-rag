frr defaults traditional
hostname r5
log syslog informational
service integrated-vtysh-config
!
interface lo
 ip address 10.255.0.5/32
 ip ospf area 0
 ip ospf passive
exit
!
interface eth1
 description ke r6
 ip address 10.0.56.1/30
 ip ospf area 0
 ip ospf network point-to-point
exit
!
router ospf
 ospf router-id 10.255.0.5
exit
!
