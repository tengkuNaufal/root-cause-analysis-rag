frr defaults traditional
hostname r1
log syslog informational
service integrated-vtysh-config
!
interface lo
 ip address 10.255.0.1/32
 ip ospf area 0
 ip ospf passive
exit
!
interface eth1
 description ke r2
 ip address 10.0.12.1/30
 ip ospf area 0
 ip ospf network point-to-point
exit
!
router ospf
 ospf router-id 10.255.0.1
exit
!
