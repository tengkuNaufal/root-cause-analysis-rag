frr defaults traditional
hostname r2
log syslog informational
service integrated-vtysh-config
!
interface lo
 ip address 10.255.0.2/32
 ip ospf area 0
 ip ospf passive
exit
!
interface eth1
 description ke r1
 ip address 10.0.12.2/30
 ip ospf area 0
 ip ospf network point-to-point
exit
!
interface eth2
 description eBGP ke r4
 ip address 10.0.24.1/30
exit
!
interface eth3
 description eBGP ke r6
 ip address 10.0.26.2/30
exit
!
router ospf
 ospf router-id 10.255.0.2
 redistribute bgp route-map RM-BGP-TO-OSPF
exit
!
router bgp 65001
 bgp router-id 10.255.0.2
 bgp log-neighbor-changes
 neighbor 10.0.24.2 remote-as 65002
 neighbor 10.0.24.2 description r4
 neighbor 10.0.26.1 remote-as 65003
 neighbor 10.0.26.1 description r6
 !
 address-family ipv4 unicast
  network 10.255.0.1/32
  network 10.255.0.2/32
  neighbor 10.0.24.2 route-map RM-EBGP-IN in
  neighbor 10.0.24.2 route-map RM-EBGP-OUT out
  neighbor 10.0.26.1 route-map RM-EBGP-IN in
  neighbor 10.0.26.1 route-map RM-EBGP-OUT out
 exit-address-family
exit
!
ip prefix-list PL-LOOPBACKS seq 10 permit 10.255.0.0/24 ge 32
!
route-map RM-EBGP-IN permit 10
 match ip address prefix-list PL-LOOPBACKS
exit
!
route-map RM-EBGP-OUT permit 10
 match ip address prefix-list PL-LOOPBACKS
exit
!
route-map RM-BGP-TO-OSPF permit 10
 match ip address prefix-list PL-LOOPBACKS
exit
!
