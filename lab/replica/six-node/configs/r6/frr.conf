frr defaults traditional
hostname r6
log syslog informational
service integrated-vtysh-config
!
interface lo
 ip address 10.255.0.6/32
 ip ospf area 0
 ip ospf passive
exit
!
interface eth1
 description ke r5
 ip address 10.0.56.2/30
 ip ospf area 0
 ip ospf network point-to-point
exit
!
interface eth2
 description eBGP ke r4
 ip address 10.0.46.2/30
exit
!
interface eth3
 description eBGP ke r2
 ip address 10.0.26.1/30
exit
!
router ospf
 ospf router-id 10.255.0.6
 redistribute bgp route-map RM-BGP-TO-OSPF
exit
!
router bgp 65003
 bgp router-id 10.255.0.6
 bgp log-neighbor-changes
 neighbor 10.0.46.1 remote-as 65002
 neighbor 10.0.46.1 description r4
 neighbor 10.0.26.2 remote-as 65001
 neighbor 10.0.26.2 description r2
 !
 address-family ipv4 unicast
  network 10.255.0.5/32
  network 10.255.0.6/32
  neighbor 10.0.46.1 route-map RM-EBGP-IN in
  neighbor 10.0.46.1 route-map RM-EBGP-OUT out
  neighbor 10.0.26.2 route-map RM-EBGP-IN in
  neighbor 10.0.26.2 route-map RM-EBGP-OUT out
 exit-address-family
exit
!
ip prefix-list PL-LOOPBACKS seq 10 permit 10.255.0.0/24 ge 32
!
route-map RM-EBGP-IN permit 10
 match ip address prefix-list PL-LOOPBACKS
exit
!
route-map RM-EBGP-OUT permit 10
 match ip address prefix-list PL-LOOPBACKS
exit
!
route-map RM-BGP-TO-OSPF permit 10
 match ip address prefix-list PL-LOOPBACKS
exit
!
